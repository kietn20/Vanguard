services:
  # Kafka in KRaft mode
  kafka:
    image: apache/kafka:latest
    container_name: vanguard-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9094'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: vanguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard_dev_password
      POSTGRES_DB: vanguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Inventory Service
  inventory-service:
    build:
      context: ./services/inventory-service
      dockerfile: Dockerfile
    container_name: vanguard-inventory
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vanguard
      SPRING_DATASOURCE_USERNAME: vanguard
      SPRING_DATASOURCE_PASSWORD: vanguard_dev_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_KAFKA_TOPIC: factory_events
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Guardrail Service
  guardrail-service:
    build:
      context: ./services/guardrail-service
      dockerfile: Dockerfile
    container_name: vanguard-guardrail
    ports:
      - "8083:8083"
    depends_on:
      - kafka

  # Maintenance Service
  maintenance-service:
    build:
      context: ./services/maintenance-service
      dockerfile: Dockerfile
    container_name: vanguard-maintenance
    ports:
      - "8081:8081"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      SPRING_KAFKA_TOPIC: factory_events
    depends_on:
      kafka:
        condition: service_healthy

  # AI Agents
  ai-agents:
    build:
      context: ./brain
      dockerfile: Dockerfile
    container_name: vanguard-agents
    ports:
      - "8000:8000"  # Metrics endpoint
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: factory_events
      INVENTORY_API_BASE: http://inventory-service:8082/api/inventory
      GUARDRAIL_API_BASE: http://guardrail-service:8083/api/guardrail
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      kafka:
        condition: service_healthy
      inventory-service:
        condition: service_started
      guardrail-service:
        condition: service_started

  # Factory Simulator
  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: vanguard-simulator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_TOPIC: factory_events
      EVENT_INTERVAL_SECONDS: 10
    depends_on:
      kafka:
        condition: service_healthy

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vanguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - inventory-service
      - guardrail-service
      - ai-agents

  # Grafana
  grafana:
    image: grafana/grafana:10.2.3
    container_name: vanguard-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: vanguard2024
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
