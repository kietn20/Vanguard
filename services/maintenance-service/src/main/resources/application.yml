# Spring Boot Application Configuration
spring:
  application:
    name: maintenance-service

  # Database Configuration - Disabled for now
  # datasource:
  #   url: jdbc:postgresql://localhost:5432/maintenance_db
  #   username: postgres
  #   password: password
  #   driver-class-name: org.postgresql.Driver
  
  # jpa:
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true
  #   properties:
  #     hibernate:
  #       dialect: org.hibernate.dialect.PostgreSQLDialect

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    topic: factory_events
    consumer:
      group-id: maintenance-service-group
      # Consumer will start from earliest message if no offset exists
      auto-offset-reset: earliest
      # Manual commit for better control
      enable-auto-commit: false
      # Error handling configuration
      properties:
        spring.json.trusted.packages: com.vanguard.maintenance.model
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer

# Logging Configuration
logging:
  level:
    root: INFO
    com.vanguard.maintenance: DEBUG
    org.springframework.kafka: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"

# Server Configuration
server:
  port: 8081
