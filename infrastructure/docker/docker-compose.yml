version: '3.8'

networks:
  vanguard-net:
    driver: bridge

services:
  # Apache Kafka in KRaft mode (no Zookeeper needed)
  kafka:
    image: apache/kafka:latest
    container_name: vanguard-kafka
    hostname: kafka
    ports:
      - "9092:9092"  # External access from host machine
      - "9093:9093"  # Internal broker communication
    environment:
      # Node configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'

      # Listener configuration
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9093,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'

      # Controller configuration
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9094'

      # Topic defaults (for single-node development)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Log directory
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - vanguard-net

  # PostgreSQL database for factory state
  postgres:
    image: postgres:16-alpine
    container_name: vanguard-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vanguard
      POSTGRES_PASSWORD: vanguard_dev_password
      POSTGRES_DB: vanguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vanguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vanguard-net

  # Kafka UI for visualization and debugging
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vanguard-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vanguard-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_READONLY: false
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - vanguard-net

volumes:
  postgres-data:
    driver: local
