apiVersion: v1
kind: Service
metadata:
  name: guardrail-service
  namespace: vanguard
  labels:
    app: guardrail-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8083"
    prometheus.io/path: "/actuator/prometheus"
spec:
  type: ClusterIP
  selector:
    app: guardrail-service
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-service
  namespace: vanguard
  labels:
    app: guardrail-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guardrail-service
  template:
    metadata:
      labels:
        app: guardrail-service
    spec:
      containers:
      - name: guardrail-service
        image: vanguard/guardrail-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/guardrail/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/guardrail/health
            port: 8083
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
