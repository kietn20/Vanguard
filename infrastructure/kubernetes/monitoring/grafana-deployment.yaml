---
# Grafana Service (for UI access)
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: vanguard
  labels:
    app: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000

---
# Grafana ConfigMap: Auto-configure Prometheus data source
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: vanguard
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
        jsonData:
          timeInterval: "15s"

---
# Grafana ConfigMap: Dashboard provider config
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: vanguard
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Vanguard Dashboards'
        orgId: 1
        folder: 'Vanguard'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: vanguard
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.3  # Latest stable version
          ports:
            - containerPort: 3000
              name: web
          env:
            # Default admin credentials (CHANGE IN PRODUCTION!)
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "vanguard2024"
            # Disable anonymous access
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            # Enable provisioning
            - name: GF_PATHS_PROVISIONING
              value: "/etc/grafana/provisioning"
          volumeMounts:
            # Mount datasource config
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Mount dashboard provider config
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Mount actual dashboards (we'll create these next)
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
            # Persistent storage for Grafana database
            - name: grafana-storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-storage
          emptyDir: {}  # Non-persistent for now
