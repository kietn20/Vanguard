apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: vanguard
data:
  inventory-dashboard.json: |
    {
        "title": "Vanguard Inventory Service",
        "uid": "vanguard-inventory",
        "tags": ["vanguard", "inventory", "java"],
        "timezone": "browser",
        "refresh": "10s",
        "schemaVersion": 38,
        "time": {
          "from": "now-30m",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "HTTP Request Rate",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "rate(http_server_requests_seconds_count{service=\"inventory-service\"}[5m])",
                "legendFormat": "{{method}} {{uri}} ({{status}})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "smooth",
                  "fillOpacity": 10
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "bottom",
                "calcs": ["last", "mean"]
              }
            }
          },
          {
            "id": 2,
            "title": "HTTP Request Duration (p95)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{service=\"inventory-service\"}[5m])) by (le, uri))",
                "legendFormat": "{{uri}} (p95)",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 20
                }
              }
            }
          },
          {
            "id": 3,
            "title": "JVM Memory Usage",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{service=\"inventory-service\", area=\"heap\"}",
                "legendFormat": "Heap Used - {{instance}}",
                "refId": "A"
              },
              {
                "expr": "jvm_memory_max_bytes{service=\"inventory-service\", area=\"heap\"}",
                "legendFormat": "Heap Max - {{instance}}",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "bytes",
                "custom": {
                  "fillOpacity": 10
                }
              }
            }
          },
          {
            "id": 4,
            "title": "HTTP Status Codes",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{service=\"inventory-service\"}[5m])) by (status)",
                "legendFormat": "{{status}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "custom": {
                  "drawStyle": "bars",
                  "fillOpacity": 80,
                  "stacking": {
                    "mode": "normal"
                  }
                }
              },
              "overrides": [
                {
                  "matcher": {"id": "byRegexp", "options": "2.."},
                  "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byRegexp", "options": "4.."},
                  "properties": [{"id": "color", "value": {"fixedColor": "yellow", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byRegexp", "options": "5.."},
                  "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]
                }
              ]
            }
          },
          {
            "id": 5,
            "title": "Active Threads",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "sum(executor_active_threads{service=\"inventory-service\"})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 10, "color": "yellow"},
                    {"value": 50, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "value",
              "graphMode": "area",
              "textMode": "value_and_name",
              "orientation": "auto"
            }
          },
          {
            "id": 6,
            "title": "Service Uptime",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 4, "y": 16},
            "targets": [
              {
                "expr": "avg(process_uptime_seconds{service=\"inventory-service\"})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 60, "color": "yellow"},
                    {"value": 300, "color": "green"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "textMode": "value"
            }
          },
          {
            "id": 7,
            "title": "Error Rate (5xx)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 8, "y": 16},
            "targets": [
              {
                "expr": "sum(rate(http_server_requests_seconds_count{service=\"inventory-service\", status=~\"5..\"}[5m]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "reqps",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 0.1, "color": "yellow"},
                    {"value": 1, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value"
            }
          },
          {
            "id": 8,
            "title": "GC Pause Time (p99)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 12, "y": 16},
            "targets": [
              {
                "expr": "histogram_quantile(0.99, sum(rate(jvm_gc_pause_seconds_bucket{service=\"inventory-service\"}[5m])) by (le))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 0.1, "color": "yellow"},
                    {"value": 0.5, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "value"
            }
          },
          {
            "id": 9,
            "title": "CPU Usage",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 16, "y": 16},
            "targets": [
              {
                "expr": "avg(system_cpu_usage{service=\"inventory-service\"}) * 100",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 70, "color": "yellow"},
                    {"value": 90, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "value",
              "textMode": "value"
            }
          },
          {
            "id": 10,
            "title": "Total Replicas",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 20, "y": 16},
            "targets": [
              {
                "expr": "count(up{service=\"inventory-service\"})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 1, "color": "yellow"},
                    {"value": 2, "color": "green"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "textMode": "value_and_name"
            }
          }
        ]
    }

  agent-dashboard.json: |
    {
        "title": "Vanguard AI Agent Performance",
        "uid": "vanguard-agents",
        "tags": ["vanguard", "ai", "agents"],
        "timezone": "browser",
        "refresh": "10s",
        "schemaVersion": 38,
        "time": {
          "from": "now-30m",
          "to": "now"
        },
        "panels": [
          {
            "id": 1,
            "title": "Events Processed (by Type)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
            "targets": [
              {
                "expr": "rate(vanguard_events_processed_total[5m])",
                "legendFormat": "{{event_type}} ({{severity}})",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "events/sec",
                "custom": {
                  "drawStyle": "line",
                  "lineInterpolation": "smooth",
                  "fillOpacity": 20,
                  "stacking": {
                    "mode": "normal"
                  }
                }
              }
            },
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "right",
                "calcs": ["last", "sum"]
              }
            }
          },
          {
            "id": 2,
            "title": "Event Processing Latency (p50, p95, p99)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
            "targets": [
              {
                "expr": "histogram_quantile(0.50, sum(rate(vanguard_event_processing_seconds_bucket[5m])) by (le))",
                "legendFormat": "p50",
                "refId": "A"
              },
              {
                "expr": "histogram_quantile(0.95, sum(rate(vanguard_event_processing_seconds_bucket[5m])) by (le))",
                "legendFormat": "p95",
                "refId": "B"
              },
              {
                "expr": "histogram_quantile(0.99, sum(rate(vanguard_event_processing_seconds_bucket[5m])) by (le))",
                "legendFormat": "p99",
                "refId": "C"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": {
                  "drawStyle": "line",
                  "lineWidth": 2
                }
              },
              "overrides": [
                {
                  "matcher": {"id": "byName", "options": "p50"},
                  "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byName", "options": "p95"},
                  "properties": [{"id": "color", "value": {"fixedColor": "yellow", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byName", "options": "p99"},
                  "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]
                }
              ]
            }
          },
          {
            "id": 3,
            "title": "Decisions Made (by Type)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
            "targets": [
              {
                "expr": "rate(vanguard_decisions_made_total[5m])",
                "legendFormat": "{{agent}}: {{decision_type}}",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "decisions/sec",
                "custom": {
                  "drawStyle": "bars",
                  "fillOpacity": 80,
                  "stacking": {
                    "mode": "normal"
                  }
                }
              }
            }
          },
          {
            "id": 4,
            "title": "Actions Taken (Success vs Failed)",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
            "targets": [
              {
                "expr": "rate(vanguard_actions_taken_total{result=\"success\"}[5m])",
                "legendFormat": "{{action_type}} (Success)",
                "refId": "A"
              },
              {
                "expr": "rate(vanguard_actions_taken_total{result=\"failed\"}[5m])",
                "legendFormat": "{{action_type}} (Failed)",
                "refId": "B"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "actions/sec",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 30
                }
              },
              "overrides": [
                {
                  "matcher": {"id": "byRegexp", "options": ".*Success.*"},
                  "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byRegexp", "options": ".*Failed.*"},
                  "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]
                }
              ]
            }
          },
          {
            "id": 5,
            "title": "Guardrail Validation Results",
            "type": "piechart",
            "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
            "targets": [
              {
                "expr": "sum(increase(vanguard_guardrail_validations_total[30m])) by (result)",
                "legendFormat": "{{result}}",
                "refId": "A"
              }
            ],
            "options": {
              "legend": {
                "displayMode": "table",
                "placement": "right",
                "values": ["value", "percent"]
              },
              "pieType": "donut"
            },
            "fieldConfig": {
              "overrides": [
                {
                  "matcher": {"id": "byName", "options": "approved"},
                  "properties": [{"id": "color", "value": {"fixedColor": "green", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byName", "options": "rejected"},
                  "properties": [{"id": "color", "value": {"fixedColor": "red", "mode": "fixed"}}]
                },
                {
                  "matcher": {"id": "byName", "options": "requires_approval"},
                  "properties": [{"id": "color", "value": {"fixedColor": "yellow", "mode": "fixed"}}]
                }
              ]
            }
          },
          {
            "id": 6,
            "title": "Agent Decision Latency",
            "type": "timeseries",
            "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
            "targets": [
              {
                "expr": "histogram_quantile(0.95, sum(rate(vanguard_agent_decision_seconds_bucket[5m])) by (le, agent))",
                "legendFormat": "{{agent}} (p95)",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s",
                "custom": {
                  "drawStyle": "line",
                  "fillOpacity": 20
                }
              }
            }
          },
          {
            "id": 7,
            "title": "Low Stock Parts Alert",
            "type": "stat",
            "gridPos": {"h": 8, "w": 4, "x": 16, "y": 16},
            "targets": [
              {
                "expr": "vanguard_low_stock_parts",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 3, "color": "yellow"},
                    {"value": 5, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "graphMode": "area",
              "textMode": "value_and_name",
              "text": {
                "titleSize": 16,
                "valueSize": 48
              }
            }
          },
          {
            "id": 8,
            "title": "Active Agents",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 20, "y": 16},
            "targets": [
              {
                "expr": "vanguard_active_agents",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 1, "color": "green"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "background",
              "textMode": "value_and_name"
            }
          },
          {
            "id": 9,
            "title": "Actions Awaiting Approval",
            "type": "stat",
            "gridPos": {"h": 4, "w": 4, "x": 20, "y": 20},
            "targets": [
              {
                "expr": "vanguard_parts_awaiting_approval",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "green"},
                    {"value": 1, "color": "yellow"},
                    {"value": 5, "color": "red"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "value",
              "textMode": "value"
            }
          },
          {
            "id": 10,
            "title": "Total Events Processed (Last 24h)",
            "type": "stat",
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24},
            "targets": [
              {
                "expr": "sum(increase(vanguard_events_processed_total[24h]))",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "none",
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "blue"}
                  ]
                }
              }
            },
            "options": {
              "colorMode": "value",
              "textMode": "value_and_name"
            }
          },
          {
            "id": 11,
            "title": "Event Processing Success Rate",
            "type": "gauge",
            "gridPos": {"h": 4, "w": 6, "x": 6, "y": 24},
            "targets": [
              {
                "expr": "(sum(rate(vanguard_events_processed_total[5m])) / (sum(rate(vanguard_events_processed_total[5m])) + sum(rate(vanguard_actions_taken_total{result=\"failed\"}[5m])))) * 100",
                "refId": "A"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "percent",
                "min": 0,
                "max": 100,
                "thresholds": {
                  "mode": "absolute",
                  "steps": [
                    {"value": 0, "color": "red"},
                    {"value": 90, "color": "yellow"},
                    {"value": 95, "color": "green"}
                  ]
                }
              }
            },
            "options": {
              "showThresholdLabels": true,
              "showThresholdMarkers": true
            }
          }
        ]
    }
