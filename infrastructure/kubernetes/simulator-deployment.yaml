apiVersion: apps/v1
kind: Deployment
metadata:
  name: simulator
  namespace: vanguard
  labels:
    app: simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simulator
  template:
    metadata:
      labels:
        app: simulator
    spec:
      containers:
      - name: simulator
        image: vanguard/simulator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_TOPIC
        - name: EVENT_INTERVAL_SECONDS
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: EVENT_INTERVAL_SECONDS
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
