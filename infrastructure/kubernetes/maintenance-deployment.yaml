apiVersion: v1
kind: Service
metadata:
  name: maintenance-service
  namespace: vanguard
  labels:
    app: maintenance-service
spec:
  type: ClusterIP
  selector:
    app: maintenance-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-service
  namespace: vanguard
  labels:
    app: maintenance-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maintenance-service
  template:
    metadata:
      labels:
        app: maintenance-service
    spec:
      containers:
      - name: maintenance-service
        image: vanguard/maintenance-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: SPRING_KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_TOPIC
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 5
