apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: vanguard
  labels:
    app: api-gateway
spec:
  type: LoadBalancer  # Or ClusterIP if using Ingress
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: vanguard
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: vanguard/ai-agents:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "run_api.py"]
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: metrics
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: KAFKA_TOPIC
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: KAFKA_TOPIC
        - name: INVENTORY_MCP_URL
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: INVENTORY_MCP_URL
        - name: GUARDRAIL_MCP_URL
          valueFrom:
            configMapKeyRef:
              name: vanguard-config
              key: GUARDRAIL_MCP_URL
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: vanguard-secrets
              key: GEMINI_API_KEY
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
