name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-java:
    name: Test Java Services
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Test Inventory Service
        run: |
          cd services/inventory-service
          mvn clean test

      - name: Test Guardrail Service
        run: |
          cd services/guardrail-service
          mvn clean test

  test-python:
    name: Test Python Agents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          cd brain
          poetry install

      - name: Run tests
        run: |
          cd brain
          poetry run pytest tests/

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-java, test-python]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Inventory Service
        run: |
          cd services/inventory-service
          docker build -t vanguard/inventory-service:latest .

      - name: Build AI Agents
        run: |
          cd brain
          docker build -t vanguard/ai-agents:latest .
